<style>
*{box-sizing:border-box;margin:0;padding:0}

#app.glitching #stage{animation:gl .33s steps(3) forwards}
@keyframes gl{0%{transform:none}33%{transform:translate(-14px,4px) skewX(10deg);filter:hue-rotate(90deg) saturate(3)}66%{transform:translate(12px,-6px);filter:hue-rotate(-90deg) contrast(2)}100%{opacity:0;transform:translate(-4px,0)}}
@keyframes gin{0%{transform:translate(10px,-3px) skewX(-8deg);filter:hue-rotate(-60deg) saturate(3)}50%{transform:translate(-8px,3px);filter:hue-rotate(60deg)}100%{transform:none;filter:none}}

@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-5%,3%)}40%{transform:translate(3%,-6%)}60%{transform:translate(-4%,5%)}80%{transform:translate(6%,-2%)}100%{transform:translate(0,0)}}

  const typing = async ms => { st.textContent = 'escribiendo…'; const t = add(h('div', 'typingb', '<i></i><i></i><i></i>')); await later(ms); t.remove(); st.textContent = status; };
  const items = parseScript(sc.script);
  (async () => {
    await later(800);
    for (const it of items) {
      if (!alive()) return;
      if (it.k === 'text') { await typing(Math.min(2600, 500 + plain(it.t).length * 26)); if (!alive()) return; add(h('div', 'msg in', fmt(it.t) + time())); A.pop(); await later(450); }
      else if (it.k === 'pausa') await later((+it.p[0] || 1) * 1000);
      else if (it.k === 'audio') {
        st.textContent = 'grabando audio…'; await later(1300); st.textContent = status; if (!alive()) return;
        const url = isUrl(it.p[0]) ? it.p[0] : '', text = url ? it.p.slice(1).join(' | ') : it.p.join(' | ');
        const vn = voiceNote(url, text, sc.avatar, sc.contact); add(vn.el); A.pop();
        if (sc.gate !== false) { vn.el.classList.add('pend'); await vn.played; } else await later(700);
        await later(500);
      }
      else if (it.k === 'img') { await typing(900); if (!alive()) return; add(h('div', 'msg in media', `<img src="${esc(it.p[0])}" alt="">${it.p[1] ? `<div class="cap">${fmt(it.p[1])}</div>` : ''}${time()}`)); A.pop(); await later(1100); }
      else if (it.k === 'video') {
        await typing(900); if (!alive()) return;
        const m = add(h('div', 'msg in media', `<video src="${esc(it.p[0])}" controls playsinline preload="metadata"></video>${it.p[1] ? `<div class="cap">${fmt(it.p[1])}</div>` : ''}${time()}`)); A.pop();
        const v = m.querySelector('video'); MEDIA.add(v); v.onplay = () => { TTS.stop(); A.duck(true); };
        if (sc.gate !== false) { await new Promise(r => { v.onended = r; v.addEventListener('play', () => later(Math.min(15000, (v.duration || 10) * 1000)).then(r), { once: true }); }); } else await later(1200);
      }
      else if (it.k === 'link') {
        const [u, ti, de, im] = it.p; await typing(900); if (!alive()) return;
        add(h('div', 'msg in', `<a class="link" href="${esc(safeHref(u))}" target="_blank" rel="noopener">${im ? `<img src="${esc(im)}" alt="">` : ''}<b>${fmt(ti || u)}</b>${de ? `<small>${fmt(de)}</small>` : ''}</a><a class="u" href="${esc(safeHref(u))}" target="_blank" rel="noopener">${esc(u)}</a>${time()}`)); A.pop(); await later(800);
      }
      else if (it.k === 'reply') {
        ph.style.display = 'none'; txt.textContent = plain(it.t); send.innerHTML = ICON.send; send.classList.add('go');
        const tap = add(h('div', 'tap', esc(sc.tapHint || 'Toca para enviar')));
        await new Promise(r => { send.onclick = e => { e.stopPropagation(); A.init(); r(); }; });
        send.onclick = null; tap.remove(); send.classList.remove('go'); send.innerHTML = ICON.mic; txt.textContent = ''; ph.style.display = '';
        add(h('div', 'msg out', fmt(it.t) + `<span class="t">${hm()} ${ICON.ticks}</span>`)); A.sent(); await later(900);
      }
      else if (it.k === 'boton') {
        const [label, u = ''] = it.p; await typing(700); if (!alive()) return;
        const m = add(h('div', 'msg in cta-msg', ''));
        if (!u || /^#/.test(u)) { const b = h('button', 'cbtnmsg', fmt(label || 'Continuar')); b.onclick = e => { e.stopPropagation(); A.init(); A.click(); done(); }; m.appendChild(b); }
        else { const a = h('a', 'cbtnmsg', fmt(label || 'Abrir')); a.href = safeHref(u); a.target = '_blank'; a.rel = 'noopener'; a.onclick = e => { e.stopPropagation(); A.init(); track('cta', sc); try { window.fbq && window.fbq('track', 'InitiateCheckout'); } catch (er) {} }; m.appendChild(a); }
        A.pop();
      }
    }
  })();
};

if (!SC.length) { stage.innerHTML = '<div class="scene"><h2 class="h2">Este embudo aún no tiene escenas</h2></div>'; curtain.className = 'curtain slow'; app.classList.add('ready'); return; }
show(Math.min(SC.length - 1, Math.max(0, +window.FUNNEL_START || 0)));
})();
